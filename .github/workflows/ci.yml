name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:   # PyTorch 2.14 only (no legacy support)
          - python: "3.12"
            torch: "torch>=2.14,<2.15"
          - python: "3.13"
            torch: "torch>=2.14,<2.15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check xkan tests
      - name: Test
        run: pytest -q tests
